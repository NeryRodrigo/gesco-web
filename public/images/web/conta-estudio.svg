      <rect x="8" y="8" width="26" height="26"/><rect x="13" y="13" width="16" height="16" fill="#fff"/><rect x="17" y="17" width="8" height="8"/>
      <rect x="70" y="8" width="26" height="26"/><rect x="75" y="13" width="16" height="16" fill="#fff"/><rect x="79" y="17" width="8" height="8"/>
      <rect x="8" y="70" width="26" height="26"/><rect x="13" y="75" width="16" height="16" fill="#fff"/><rect x="17" y="79" width="8" height="8"/>
      <rect x="42" y="10" width="8" height="8"/><rect x="54" y="18" width="8" height="8"/><rect x="42" y="30" width="8" height="8"/>
      <rect x="44" y="46" width="8" height="8"/><rect x="58" y="46" width="8" height="8"/><rect x="70" y="50" width="8" height="8"/>
      <rect x="84" y="44" width="8" height="8"/><rect x="10" y="46" width="8" height="8"/><rect x="24" y="52" width="8" height="8"/>
      <rect x="46" y="62" width="8" height="8"/><rect x="60" y="72" width="8" height="8"/><rect x="74" y="66" width="8" height="8"/>
      <rect x="86" y="80" width="8" height="8"/><rect x="48" y="84" width="8" height="8"/><rect x="66" y="88" width="8" height="8"/>
    </g>
    <rect x="140" y="214" width="88" height="8" rx="4" fill="#94A3B8"/>
    <rect x="140" y="232" width="70" height="8" rx="4" fill="#94A3B8"/>
    <rect x="140" y="250" width="80" height="8" rx="4" fill="#94A3B8"/>
  </g>
  <!-- línea de lectura -->
  <rect x="96" y="300" width="300" height="3" fill="url(#brillo)" transform="rotate(-4 246 301)"/>
  <!-- tarjeta de resultado -->
  <g transform="translate(360 210)">
    <rect width="220" height="170" rx="18" fill="#0C1327" stroke="#14B8A6" stroke-opacity=".5"/>
