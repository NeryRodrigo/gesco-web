    <path d="M24 32l4 4 8-9" stroke="#03121a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="26" width="120" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="22" y="62" width="70" height="8" rx="4" fill="#64748B"/><rect x="128" y="62" width="70" height="8" rx="4" fill="#14B8A6"/>
    <rect x="22" y="84" width="60" height="8" rx="4" fill="#64748B"/><rect x="138" y="84" width="60" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="22" y="106" width="80" height="8" rx="4" fill="#64748B"/><rect x="118" y="106" width="80" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="22" y="134" width="176" height="18" rx="9" fill="#14B8A6" opacity=".18"/>
    <rect x="34" y="140" width="110" height="6" rx="3" fill="#14B8A6"/>
