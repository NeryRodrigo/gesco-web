<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Factura electrónica con QR leída por VORDIA CONTA">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131c"/>
      <stop offset="1" stop-color="#020407"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#14B8A6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#fondo)"/>
  <circle cx="470" cy="150" r="170" fill="#14B8A6" opacity=".08"/>
  <!-- factura -->
  <g transform="translate(110 70) rotate(-4)">
    <rect width="250" height="330" rx="14" fill="#F5F7FA"/>
    <rect x="22" y="24" width="120" height="12" rx="6" fill="#0F172A"/>
    <rect x="22" y="46" width="80" height="8" rx="4" fill="#94A3B8"/>
    <rect x="22" y="80" width="206" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="96" width="180" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="112" width="196" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="128" width="150" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="156" width="206" height="1.5" fill="#94A3B8"/>
    <rect x="22" y="170" width="90" height="10" rx="5" fill="#0F172A"/>
    <rect x="160" y="170" width="68" height="10" rx="5" fill="#0F172A"/>
